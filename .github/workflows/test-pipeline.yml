name: Test Pipeline Artifacts

on:
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - 'packaging/**'
      - 'tests/**'
      - 'MacAudioTests/**'
      - 'MacAudioDriver/**'
      - 'MacAudio/AudioEngine/**'
      - 'MacAudio/Models/**'
      - 'MacAudio/Utilities/**'
      - 'MacAudio/MacAudio.entitlements'
      - 'project.yml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/release.yml'
      - 'packaging/**'
      - 'tests/**'
      - 'MacAudioTests/**'
      - 'MacAudioDriver/**'
      - 'MacAudio/AudioEngine/**'
      - 'MacAudio/Models/**'
      - 'MacAudio/Utilities/**'
      - 'MacAudio/MacAudio.entitlements'
      - 'project.yml'

jobs:
  test-c-ring-buffer:
    runs-on: macos-15
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Compile ring buffer tests
        run: |
          cc -std=c11 -Wall -Wextra -Werror \
             -I MacAudioDriver \
             -DkSHM_Name='"/macaudio_test_rb"' \
             -o tests/test_ring_buffer \
             tests/test_ring_buffer.c MacAudioDriver/SharedRingBuffer.c
      - name: Run ring buffer tests
        run: ./tests/test_ring_buffer

  test-pipeline:
    runs-on: macos-15
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Install PyYAML in venv
        run: |
          python3 -m venv /tmp/testvenv
          source /tmp/testvenv/bin/activate
          pip install pyyaml
      - name: Run pipeline tests
        run: |
          source /tmp/testvenv/bin/activate
          python3 -m unittest tests.test_release_pipeline -v

  test-source-integrity:
    runs-on: macos-15
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest tests.test_source_integrity -v

  test-swift:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install xcodegen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Restore entitlements
        run: |
          cat > MacAudio/MacAudio.entitlements << 'ENTITLEMENTS'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>com.apple.security.device.audio-input</key>
              <true/>
          </dict>
          </plist>
          ENTITLEMENTS
      - name: Restore driver Info.plist CFBundleExecutable
        run: |
          /usr/libexec/PlistBuddy -c "Add :CFBundleExecutable string '\$(EXECUTABLE_NAME)'" \
            MacAudioDriver/Info.plist 2>/dev/null || \
          /usr/libexec/PlistBuddy -c "Set :CFBundleExecutable '\$(EXECUTABLE_NAME)'" \
            MacAudioDriver/Info.plist
      - name: Run Swift unit tests
        run: |
          xcodebuild test \
            -project MacAudio.xcodeproj \
            -scheme MacAudio \
            -destination 'platform=macOS' \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGN_STYLE=Automatic \
            DEVELOPMENT_TEAM="" \
            ENABLE_HARDENED_RUNTIME=NO
